<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080d14">
<title>Offline — WP API Pro</title>
<link rel="icon" href="/assets/icons/favicon-32.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;min-height:100dvh;background:#060810;color:#e8edf8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .box{max-width:340px}
  img{width:84px;height:84px;margin-bottom:20px}
  h1{font-size:22px;margin-bottom:8px}
  p{color:#9ba8c0;font-size:15px;line-height:1.6;margin-bottom:24px}
  button{background:#25d366;color:#000;border:0;border-radius:12px;padding:14px 26px;font-size:16px;font-weight:700;cursor:pointer;min-width:180px}
</style>
</head>
<body>
  <div class="box">
    <img src="/assets/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>WP API Pro needs an internet connection. Your campaigns and chats are safe — reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
